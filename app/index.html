<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Training Tracker</title>
  <meta name="theme-color" content="#13294b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Training">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <button class="icon-btn" id="prev" aria-label="Previous">‹</button>
      <h1 id="title">Training</h1>
      <button class="icon-btn" id="next" aria-label="Next">›</button>
    </div>
    <p class="sub" id="sub"></p>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav class="tabs" aria-label="Main">
    <button data-tab="today"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>Today</button>
    <button data-tab="session"><svg viewBox="0 0 24 24"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>Session</button>
    <button data-tab="week"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</button>
    <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Stats</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button>
  </nav>
  <div class="toast" id="toast" role="status"></div>
  <noscript>This app needs JavaScript turned on.</noscript>
</body>
</html>
